name: Dependency security audit

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend, mobile, contracts]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high --json > "${{ runner.temp }}/${{ matrix.package }}-npm-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-${{ matrix.package }}
          path: ${{ runner.temp }}/${{ matrix.package }}-npm-audit.json
          if-no-files-found: warn
      - name: Enforce severity threshold
        if: steps.audit.outcome == 'failure'
        run: exit 1

  cargo-audit:
    name: cargo audit (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [aura-vault, aura-migration]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/setup-rust-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --root "$HOME/.cargo"
      - name: Audit Rust dependencies
        id: audit
        continue-on-error: true
        run: cargo audit --json > "${{ runner.temp }}/${{ matrix.crate }}-cargo-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-${{ matrix.crate }}
          path: ${{ runner.temp }}/${{ matrix.crate }}-cargo-audit.json
          if-no-files-found: warn
      - name: Enforce vulnerability threshold
        if: steps.audit.outcome == 'failure'
        run: exit 1

  report:
    if: always()
    needs: [npm-audit, cargo-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Summarize audit status
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ needs.npm-audit.result }}' === 'failure' || '${{ needs.cargo-audit.result }}' === 'failure';
            const summary = `Dependency audit ${failed ? 'found high or critical vulnerabilities' : 'passed'} (npm: ${{ needs.npm-audit.result }}, cargo: ${{ needs.cargo-audit.result }}). Download the workflow artifacts for scanner reports.`;
            await core.summary.addHeading('Dependency security audit').addRaw(summary).write();
            if (context.eventName === 'pull_request') {
              const { owner, repo } = context.repo;
              const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${context.payload.pull_request.head.ref}`, state: 'open' });
              if (prs.data[0]) await github.rest.issues.createComment({ owner, repo, issue_number: prs.data[0].number, body: summary });
            }
            if (context.eventName === 'schedule' && failed) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Nightly dependency audit found vulnerabilities', body: `${summary}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
