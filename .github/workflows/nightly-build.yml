name: Nightly deployable build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t aura-vault-backend:nightly .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t aura-vault-frontend:nightly .
      - name: Build Soroban contract Wasm
        run: cargo build --manifest-path aura-vault/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Build migration Wasm
        run: cargo build --manifest-path aura-migration/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Export deployable images
        run: docker save aura-vault-backend:nightly aura-vault-frontend:nightly -o nightly-images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: deployable-nightly-${{ github.run_number }}
          path: |
            nightly-images.tar
            target/wasm32-unknown-unknown/release/*.wasm
            aura-vault/target/wasm32-unknown-unknown/release/*.wasm
            aura-migration/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 14
      - name: Write build summary
        run: |
          echo '## Nightly deployable artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo 'Backend and frontend container images plus release Wasm artifacts are available in this run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Open issue when build fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly build failed (${new Date().toISOString().slice(0, 10)})`;
            const body = `The scheduled build failed. Review logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({ ...context.repo, state: 'open' });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['nightly-build-failure'] });
            }
